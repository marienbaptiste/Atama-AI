<!doctype html>
<meta charset="utf-8">
<title>Sensei preview</title>
<style>
  html,body{margin:0;height:100%;background:#15171a;color:#e6e6e6;
            font:13px system-ui,-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  #ui{position:fixed;top:12px;left:12px;z-index:10;background:#1e2126e6;padding:12px 14px;
      border-radius:10px;backdrop-filter:blur(10px);width:300px;max-height:calc(100vh - 24px);
      overflow:auto}
  h2{font-size:11px;margin:14px 0 6px;letter-spacing:.08em;text-transform:uppercase;color:#7f8892}
  h2:first-of-type{margin-top:10px}
  button,select{font:12px system-ui;padding:5px 9px;background:#2a2e35;color:#e6e6e6;
                border:1px solid #3a3f47;border-radius:6px;cursor:pointer}
  button:hover{background:#3a404a}
  button.on{background:#3f6fd0;border-color:#5b86e0}
  select{width:100%}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  label{display:flex;align-items:center;gap:6px;color:#9aa3ad;margin-top:6px}
  input[type=range]{flex:1}
  #talk{width:100%;padding:10px;margin-bottom:8px;font-size:13px;font-weight:600;
        touch-action:none;user-select:none}
  #talk.hot{background:#c0392b;border-color:#e05b4a;color:#fff}
  #live{font-size:11px;color:#8b939d;line-height:1.5}
  /* Collapsed by default: the rig panel is for tuning, and it is in the way when the point is
     to have a conversation with her. */
  details{margin-top:12px;border-top:1px solid #2c3138;padding-top:8px}
  summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
          color:#7f8892;user-select:none;outline:none}
  summary:hover{color:#b6bec8}
  details[open] summary{color:#b6bec8;margin-bottom:2px}
  #live.on{color:#8fd18f}
  #log{margin-top:12px;font-size:11px;color:#8b939d;line-height:1.6;
       border-top:1px solid #2c3138;padding-top:9px}
  .err{color:#ff8a80}
  code{background:#2a2e35;padding:1px 4px;border-radius:3px}
</style>

<div id="stage"></div>
<div id="ui">
  <select id="who"></select>

  <button id="talk" disabled>hold SPACE to talk</button>
  <div id="live">not connected</div>

  <details id="rig">
    <summary>rig controls</summary>

    <h2>say it</h2>
    <div class="row" id="emotions"></div>

    <h2>mood</h2>
    <div class="row" id="moods"></div>

    <h2>gesture</h2>
    <div class="row" id="gestures"></div>
    <label><input type="checkbox" id="mirror" checked> vary hands (80% right)</label>
    <label>hold <input type="range" id="dur" min="1" max="8" step="1" value="3"><span id="durv">3s</span></label>

    <h2>posture</h2>
    <div class="row" id="poses"></div>

    <h2>reaction</h2>
    <div class="row" id="emojis"></div>

    <h2>framing</h2>
    <label>zoom <input type="range" id="zoom" min="-3" max="4" step="0.1" value="-0.4"><span id="zoomv">-0.4</span></label>
    <label>height <input type="range" id="high" min="-0.6" max="1.2" step="0.02" value="0.38"><span id="highv">0.38</span></label>
    <label>offset <input type="range" id="offx" min="-1" max="1" step="0.02" value="-0.18"><span id="offxv">-0.18</span></label>

    <h2>stillness</h2>
    <div class="row">
      <button id="freeze">freeze all motion</button>
      <button id="reset">reset</button>
      <button id="recentre">recentre camera</button>
    </div>
  </details>

  <div id="log">loading…</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "talkinghead":"https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.4/modules/talkinghead.mjs"
}}
</script>

<script type="module">
import { TalkingHead } from "talkinghead";

// Read out of talkinghead.mjs on 2026-09-10, not the README: the README lists seven gestures and
// omits `namaste`, and never mentions the yes/no emoji animations at all.
const MOODS    = ["neutral","happy","angry","sad","fear","disgust","love","sleep"];
const GESTURES = ["handup","index","ok","thumbup","thumbdown","side","shrug","namaste"];
const POSES    = ["side","hip","turn","bend","back","straight","wide","oneknee","kneel","sitting"];
//: Safe for an upper-body frame. `bend` and `back` pitch the torso far enough to walk her out of
//: shot, and kneel/sitting/oneknee drop her below it entirely — she is teaching, standing.
//: The full list above stays available from the buttons, so you can still see what they do.
const FRAMED_POSES = ["side","hip","turn","straight","wide"];
const EMOJIS   = ["yes","no"];          // nod / shake — spec §8's あいづち listening reaction

// The cast comes from cast.json, which backend.tools.make_preview writes from the persona files
// themselves — so this page cannot drift from what prompts/<persona>.md actually declares.
// Personas without their own commissioned model fall back to the default persona's face and are
// marked as a stand-in rather than silently pretending (backend/prompt.py: resolved_avatar).
const LABELS = { minami:"みなみ先生 — female teacher", hayashi:"はやし先生 — younger man",
                 mori:"ゆい — teenager", tanaka:"たなか先生 — older man" };
let CAST = [];

// Spec §8's emotion -> rig table. Only neutral and happy are real TalkingHead moods (V0.4), so
// the other three ride on `neutral` plus ARKit blendshapes pinned with setFixedValue.
//
// Gestures and poses are POOLS, not single values, because one emotion mapped to one fixed
// gesture is what makes an avatar read as a machine: the fourth time she says something happy
// with the identical hand movement, the illusion is gone. Each turn draws from the pool, never
// repeats the previous draw, and quite often does nothing at all — `gestureChance` below 1 is
// deliberate, since a person punctuating every single sentence with their hands is as wrong as
// one who never moves.
//
// `pose` changes far more rarely than `gesture`: posture is where you are standing, a gesture is
// punctuation over it. Kneel/sitting/oneknee are excluded everywhere — she is teaching, standing.
const RIG = {
  neutral:   { mood:"neutral", shapes:{}, release:1200,
               gestures:["side"],                        gestureChance:0.10,
               poses:["side","straight","hip"],          poseChance:0.20 },
  // `react` is TalkingHead's yes/no emoji animation — a nod or a head shake. On a tutor these
  // are not decoration, they are the answer arriving before the sentence does: a nod means you
  // got it, a shake means you did not, and a learner reads both faster than they parse Japanese.
  happy:     { mood:"happy",   shapes:{}, release:2600,
               react:"yes", reactChance:0.75,
               gestures:["ok","thumbup","handup","namaste"], gestureChance:0.65,
               poses:["straight","side"],                poseChance:0.30 },
  // `release` matters here, not just on surprised: a pinned gaze beats avatarIdleEyeContact
  // outright, so without it she would look away for the rest of the session after one
  // `thinking` turn. Considering something is momentary; being evasive is not.
  thinking:  { mood:"neutral", release:2000,
               gestures:["shrug","side","index"],        gestureChance:0.55,
               poses:["hip","side","turn"],              poseChance:0.35,
               shapes:{ eyesRotateX:-0.35, eyesRotateY:0.45, browDownLeft:0.25,
                        browDownRight:0.25, mouthPucker:0.15 } },
  surprised: { mood:"neutral", release:1200,
               gestures:["handup","index","shrug"],      gestureChance:0.85,
               poses:["straight","side"],                poseChance:0.40,
               shapes:{ browInnerUp:0.9, browOuterUpLeft:0.7, browOuterUpRight:0.7,
                        eyeWideLeft:0.6, eyeWideRight:0.6, jawOpen:0.18 } },
  serious:   { mood:"neutral", release:2600,
               react:"no", reactChance:0.70,
               gestures:["index","side","handup"],       gestureChance:0.70,
               poses:["straight","wide"],                poseChance:0.25,
               shapes:{ browDownLeft:0.55, browDownRight:0.55, mouthPressLeft:0.3,
                        mouthPressRight:0.3, eyeSquintLeft:0.2, eyeSquintRight:0.2 } },

  // "go on, try it" — open, leaning in, brows up. An open palm invites; a raised finger corrects,
  // which is why encouraging and serious must not share a gesture pool.
  encouraging: { mood:"happy", release:2400,
               gestures:["handup","ok","side"],          gestureChance:0.75,
               poses:["straight","side"],                poseChance:0.30,
               shapes:{ browInnerUp:0.45, browOuterUpLeft:0.3, browOuterUpRight:0.3,
                        mouthSmileLeft:0.25, mouthSmileRight:0.25, eyeWideLeft:0.2,
                        eyeWideRight:0.2 } },

  // Praise with weight. Held longest of any expression, because a compliment that vanishes in a
  // second reads as reflex rather than as meant, and it nods almost always.
  proud:     { mood:"happy", release:3000,
               react:"yes", reactChance:0.85,
               gestures:["thumbup","ok","namaste"],      gestureChance:0.80,
               poses:["straight"],                       poseChance:0.20,
               shapes:{ mouthSmileLeft:0.5, mouthSmileRight:0.5, cheekSquintLeft:0.3,
                        cheekSquintRight:0.3, browInnerUp:0.2 } },

  // Puzzlement, NOT disapproval: no head shake here. Head tilted, one brow up, mouth to one side.
  // The student should read "I did not catch that", not "you were wrong".
  confused:  { mood:"neutral", release:2200,
               gestures:["shrug","side"],                gestureChance:0.70,
               poses:["hip","side"],                     poseChance:0.30,
               shapes:{ browInnerUp:0.5, browDownRight:0.3, eyeSquintLeft:0.25,
                        mouthLeft:0.35, mouthPucker:0.2, headRotateZ:0.12 } },
};

//: Last draw per pool, so the same gesture never fires twice running.
const lastDraw = {};
function draw(key, pool) {
  if (!pool || !pool.length) return null;
  const fresh = pool.length > 1 ? pool.filter(x => x !== lastDraw[key]) : pool;
  const value = fresh[Math.floor(Math.random() * fresh.length)];
  lastDraw[key] = value;
  return value;
}

const $ = id => document.getElementById(id);
const log = m => { $("log").innerHTML = m; };


const head = new TalkingHead($("stage"), {
  // Constructor THROWS on a falsy ttsEndpoint (talkinghead.mjs:813) even though we never call
  // their TTS — VOICEVOX makes every sound here. A placeholder satisfies it; nothing requests it.
  ttsEndpoint: "unused://voicevox-makes-the-audio",
  lipsyncModules: [],
  cameraView: "upper",
  avatarMood: "neutral",
  modelPixelRatio: 1,          // it multiplies by devicePixelRatio itself; passing it squares it
  // TalkingHead defaults to 0.2 idle / 0.5 speaking, so out of the box the tutor looks away most
  // of the time. That reads as evasive on a teacher — a student wants to be looked at while being
  // corrected. 0.9 keeps her eyes on you almost always; the residual 10% is what stops it
  // becoming a stare, since unbroken eye contact is its own kind of wrong.
  avatarIdleEyeContact: 0.9,
  avatarSpeakingEyeContact: 0.9,
});

let payloads = null, ctx = null, held = [], frozen = false;

function buttons(host, names, fn) {
  $(host).innerHTML = "";
  for (const n of names) {
    const b = document.createElement("button");
    b.textContent = n;
    b.onclick = () => fn(n);
    $(host).appendChild(b);
  }
}

function clearShapes() { held.forEach(s => head.setFixedValue(s, null)); held = []; }

//: Expressions are events, not states. Without this she keeps whatever face the last sentence
//: gave her — a `serious` turn left the brows down for the rest of the session, which is how a
//: character stops reading as alive and starts reading as frozen (reported 2026-09-10).
const SETTLE_AFTER_MS = 4000;          // face and mood back to neutral this long after a turn
const REST_AFTER_MS   = 9000;          // posture drifts back to standing a while later
const REST_POSES = ["straight", "side"];      // both framed; see FRAMED_POSES
let settleTimer = null, restTimer = null;

/** Actively aim the gaze at the camera.
 *
 *  avatarIdleEyeContact only COMPENSATES head rotation — it keeps the eyes level when the head
 *  turns, which is nearly invisible when the head is already forward. lookAtCamera() is the call
 *  that actually points her at you (avatarIgnoreCamera defaults to false, so it resolves to
 *  lookAt(null, null, t)). Verified 2026-09-10.
 */
function meetEye(ms = 600) { try { head.lookAtCamera(ms); } catch (e) {} }

/** Put the upper body back in the middle of the frame.
 *
 *  setView computes a STATIC frame from avatarHeight — it does not track the body — so a pose
 *  that shifts weight or leans slowly walks her out of shot, and orbiting with the mouse leaves
 *  her wherever you dropped her. Re-asserting after every pose change keeps her centred.
 *
 *  setView derives `upper` as z = cameraDistance + 4.5 and y = (1 - cameraY) * tan(fov/2) * z
 *  + 2 * avatarHeight / 3. So a NEGATIVE cameraDistance zooms in, and a POSITIVE cameraY drops
 *  the camera, which lifts her within the frame. Both are on sliders because this is a judgement
 *  by eye, not a number anyone can derive.
 */
//: Framing is a judgement by eye, and it was costing a round trip every time. Remember it.
const FRAMING_KEY = "atama.framing";
function saveFraming() {
  try {
    localStorage.setItem(FRAMING_KEY, JSON.stringify(
      { zoom: $("zoom").value, high: $("high").value, offx: $("offx").value }));
  } catch (e) { /* private window: not worth failing over */ }
}
function loadFraming() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(FRAMING_KEY) || "null"); } catch (e) { return; }
  if (!saved) return;
  for (const id of ["zoom", "high", "offx"]) {
    if (saved[id] !== undefined) {
      $(id).value = saved[id];
      $(id + "v").textContent = saved[id];
    }
  }
}

function reframe() {
  // setView derives `upper` as y = (1 - cameraY) * tan(fov/2) * z + 2 * avatarHeight / 3, and
  // that y is the point held at the CENTRE of the frame. A high look-at point therefore puts her
  // head in the middle with dead space above it, which reads as her sitting too low. Raising
  // cameraY lowers the look-at point and lifts her in frame — the opposite of what the name
  // suggests, which is why this needed eyes rather than reasoning (2026-09-10).
  const cameraDistance = parseFloat($("zoom").value);
  const cameraY = parseFloat($("high").value);
  // The control panel sits over the left of the viewport, so centring her in the CANVAS puts
  // her partly behind it. A small negative cameraX shifts her right, into the clear.
  const cameraX = parseFloat($("offx").value);
  try { head.setView("upper", { cameraDistance, cameraY, cameraX }); } catch (e) {}
}

/** setPoseFromTemplate takes the TEMPLATE OBJECT, not its name.
 *
 *  Its parameter is documented as `{Object} template` and internally it is always called as
 *  setPoseFromTemplate(this.poseTemplates[name]) — passing the string makes poseFactory throw on
 *  a value that has no `.props`. Worth stating because the obvious call site reads naturally and
 *  fails silently if you wrap it in a try/catch, which is exactly what happened (2026-09-10).
 */
function setPose(name, ms = 1200) {
  const template = head.poseTemplates && head.poseTemplates[name];
  if (!template) { log('<span class="err">unknown pose: ' + name + "</span>"); return false; }
  head.setPoseFromTemplate(template, ms);
  setTimeout(reframe, ms * 0.6);       // recentre as the pose settles, not before it moves
  return true;
}

//: Keep finding the camera again between turns, or she drifts off during long silences.
setInterval(() => { if (Math.random() < 0.7) meetEye(900); }, 4000);

function settleSoon() {
  clearTimeout(settleTimer);
  clearTimeout(restTimer);
  settleTimer = setTimeout(() => {
    clearShapes();
    head.setMood("neutral");
    log(($("log").innerHTML || "") + "<br><i>settled to neutral</i>");
  }, SETTLE_AFTER_MS);
  restTimer = setTimeout(() => { setPose(draw("rest", REST_POSES), 2500); }, REST_AFTER_MS);
}

//: Which hand last gestured. TalkingHead's `mirror` argument is false for the LEFT hand and
//: true for the RIGHT, so this tracks the boolean it was given.
let lastRight = true;

/** Right hand 80% of the time, and never the left twice running.
 *
 *  A plain 80/20 draw produces runs, and two left-handed gestures in a row on a right-handed
 *  person reads as a glitch rather than as variation. Forcing a right after any left keeps the
 *  left hand as the occasional accent it is meant to be, at close to the intended ratio.
 */
function rightHand() {
  const right = lastRight ? Math.random() < 0.8 : true;
  lastRight = right;
  return right;
}

//: What the last draw actually produced, so the log can show it rather than the pool.
let lastMotion = { pose: null, gesture: null };

function applyRig(name) {
  const r = RIG[name] || RIG.neutral;
  clearShapes();
  head.setMood(r.mood);
  held = Object.keys(r.shapes);
  held.forEach(s => head.setFixedValue(s, r.shapes[s]));
  // Every emotion releases. An expression with no timer is an expression she is stuck in.
  setTimeout(clearShapes, r.release ?? 2500);

  lastMotion = { pose: null, gesture: null, react: null };
  meetEye(500);              // look at the student first, then react
  reframe();

  if (r.react && Math.random() < (r.reactChance ?? 0)) {
    head.playGesture(r.react, 2, false, 400);
    lastMotion.react = r.react === "yes" ? "nod" : "shake";
  }

  if (Math.random() < (r.poseChance ?? 0)) {
    const pose = draw(name + ":pose", (r.poses || []).filter(p => FRAMED_POSES.includes(p)));
    if (pose && setPose(pose, 1200)) lastMotion.pose = pose;
  }
  if (Math.random() < (r.gestureChance ?? 0)) {
    const gesture = draw(name + ":gesture", r.gestures);
    if (gesture) {
      // Jitter the hold and the hand as well: identical timing is its own kind of robotic, and a
      // right-handed person still reaches with the other hand now and then.
      const hold = Math.max(1, +$("dur").value + (Math.random() * 1.4 - 0.7));
      const right = $("mirror").checked ? rightHand() : false;
      head.playGesture(gesture, hold, right, 600 + Math.random() * 500);
      lastMotion.gesture = gesture + (right ? " (right)" : " (left)");
    }
  }
  settleSoon();
}

async function speak(tag) {
  const p = payloads && payloads[tag];
  if (!p) return;
  ctx = ctx || new AudioContext();
  await ctx.resume();
  const bytes = Uint8Array.from(atob(p.audio_b64), c => c.charCodeAt(0));
  const buf = await ctx.decodeAudioData(bytes.buffer);
  applyRig(tag);
  // `words` is REQUIRED for supplied visemes to be read at all: in speakAudio the
  // `if (r.visemes)` branch is nested inside `if (r.words)`, while `if (r.audio)` sits outside —
  // omit it and you get audio with a frozen face. One span over the utterance opens the gate
  // without competing with our timeline, since the word-derived path runs only when !r.visemes.
  head.speakAudio({ audio: buf, words: [p.text], wtimes: [0], wdurations: [buf.duration * 1000],
                    visemes: p.visemes, vtimes: p.vtimes, vdurations: p.vdurations });
  log("<b>" + tag + "</b> — " + p.visemes.length + " visemes over "
      + Math.round(buf.duration * 1000) + " ms<br>react: <b>"
      + (lastMotion.react || "none") + "</b> · gesture: <b>"
      + (lastMotion.gesture || "none") + "</b> · posture: <b>"
      + (lastMotion.pose || "unchanged") + "</b>");
}

buttons("moods", MOODS, m => { head.setMood(m); log("mood <b>" + m + "</b>"); });

buttons("gestures", GESTURES.concat(["stop"]), g => {
  if (g === "stop") {
    if (head.stopGesture) head.stopGesture(500);
    log("gesture cleared — arms return to the idle pose");
    return;
  }
  const right = $("mirror").checked ? rightHand() : false;
  head.playGesture(g, +$("dur").value, right, 800);
  log("gesture <b>" + g + "</b> · " + $("dur").value + "s · "
      + (right ? "right" : "left") + " hand");
});

buttons("poses", POSES, p => { if (setPose(p, 1200)) log("posture <b>" + p + "</b>"); });

buttons("emojis", EMOJIS, e => {
  head.playGesture(e, 2, false, 400);
  log("reaction <b>" + e + "</b> — " + (e === "yes" ? "nod (あいづち)" : "shake"));
});

$("dur").oninput = () => { $("durv").textContent = $("dur").value + "s"; };
for (const id of ["zoom", "high", "offx"]) {
  $(id).oninput = () => { $(id + "v").textContent = $(id).value; reframe(); saveFraming(); };
}
loadFraming();

$("freeze").onclick = () => {
  frozen = !frozen;
  if (frozen) head.stop(); else head.start();
  $("freeze").classList.toggle("on", frozen);
  log(frozen ? "motion frozen — this halts the whole render loop, so lip-sync stops too"
             : "motion resumed");
};

$("recentre").onclick = () => { reframe(); log("camera recentred on the upper body"); };

$("reset").onclick = () => {
  clearShapes();
  head.setMood("neutral");
  setPose("straight", 800);
  meetEye(400);
  reframe();
  log("reset to neutral");
};

async function pick(id) {
  const c = CAST.find(x => x.id === id);
  if (!c) return;
  payloads = null;
  $("emotions").innerHTML = "";
  log("loading " + c.glb + "…");
  try {
    await head.showAvatar({ url: c.glb, body: c.body, avatarMood: "neutral", lipsyncLang: "en" });
  } catch (e) {
    log('<span class="err">' + c.glb + " failed to load.</span><br>Make them at readyplayer.me, "
        + "download with <code>?morphTargets=ARKit,Oculus%20Visemes</code>, then "
        + "<code>check_avatar</code>.");
    return;
  }
  try {
    payloads = await (await fetch(id + ".speak.json")).json();
  } catch (e) {
    log('<span class="err">no audio for ' + id + "</span> — run <code>make_preview</code>");
    return;
  }
  reframe();
  meetEye(600);
  buttons("emotions", Object.keys(RIG), speak);
  log("<b>" + c.glb + "</b>" + (c.own_face ? "" : " <i>(stand-in — this persona has no model yet)</i>")
      + "<br>voice " + c.voice + " · audio VOICEVOX · visemes ours · times in ms");
}

/** Play one `speak` message from the orchestrator (spec §8).
 *
 *  Identical to the offline preview path, which is the point: the payload the server sends is
 *  the same shape make_preview writes to disk, so if one works the other does.
 */
async function playSpeak(msg) {
  ctx = ctx || new AudioContext();
  await ctx.resume();
  const bytes = Uint8Array.from(atob(msg.audio_b64), c => c.charCodeAt(0));
  const buf = await ctx.decodeAudioData(bytes.buffer);
  applyRig(msg.emotion || "neutral");
  head.speakAudio({ audio: buf, words: [msg.text || " "], wtimes: [0],
                    wdurations: [buf.duration * 1000],
                    visemes: msg.visemes, vtimes: msg.vtimes, vdurations: msg.vdurations });
}

//: The socket, once open. Push-to-talk is meaningless without it.
let wire = null, talking = false;

function pushToTalk(on) {
  if (!wire || wire.readyState !== 1 || on === talking) return;
  talking = on;
  wire.send(JSON.stringify({ type: "control", action: on ? "start" : "stop" }));
  log(on ? "<b>listening…</b>" : "sent — waiting for her");
  $("talk").classList.toggle("hot", on);
  $("talk").textContent = on ? "listening — release to send" : "hold SPACE to talk";
}

// A browser sees keyup, which a TTY cannot, so this is a real hold rather than a toggle.
// `event.repeat` matters: holding a key fires keydown continuously, and without the guard every
// repeat would restart the turn.
//
// The earlier `e.target === document.body` test was far too strict: after clicking the persona
// dropdown focus sits on the <select>, and SPACE then did nothing at all — the microphone
// looked broken when it was simply never asked to open (2026-09-10). Only real controls that
// use SPACE themselves get to keep it.
const SPACE_BELONGS_TO = new Set(["INPUT", "TEXTAREA", "BUTTON", "SUMMARY", "SELECT", "OPTION"]);
const spaceIsOurs = target =>
  !target || (!SPACE_BELONGS_TO.has(target.tagName) && !target.isContentEditable);

addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat) return;
  if (!spaceIsOurs(e.target)) return;
  e.preventDefault();
  pushToTalk(true);
});
addEventListener("keyup", e => {
  // Release ALWAYS ends the turn, even if focus moved mid-hold — the alternative is a mic that
  // stays open because you happened to tab away.
  if (e.code === "Space" && talking) { e.preventDefault(); pushToTalk(false); }
});
// Releasing outside the window still has to end the turn, or the mic stays open forever.
addEventListener("blur", () => pushToTalk(false));
$("talk").addEventListener("pointerdown", e => { e.preventDefault(); pushToTalk(true); });
addEventListener("pointerup", () => pushToTalk(false));

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  let socket;
  try { socket = new WebSocket(url); } catch (e) { return; }

  socket.onopen = () => {
    wire = socket;
    $("talk").disabled = false;
    $("live").textContent = "connected — hold SPACE, or the button, and speak";
    $("live").classList.add("on");
  };
  socket.onclose = () => {
    wire = null; talking = false;
    $("talk").disabled = true;
    $("talk").classList.remove("hot");
    $("talk").textContent = "hold SPACE to talk";
    $("live").textContent = "disconnected — reconnecting…";
    $("live").classList.remove("on");
    setTimeout(connect, 2000);          // the REPL may simply not be running yet
  };
  socket.onmessage = async (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    switch (msg.type) {
      case "speak":       await playSpeak(msg); break;
      case "state":       $("live").textContent = "she is " + msg.state; break;
      case "stt_final":   log("<b>you:</b> " + (msg.text || "")
                              + (msg.accepted ? "" : " <i>(discarded: " + msg.reason + ")</i>")); break;
      case "bargein":     head.stopSpeaking && head.stopSpeaking(); break;
      case "service_status": break;     // the status bar is M3 proper
      case "error":       log('<span class="err">' + msg.message + "</span>"); break;
    }
  };
}
connect();

$("who").onchange = () => pick($("who").value);

(async function boot() {
  try {
    CAST = await (await fetch("cast.json")).json();
  } catch (e) {
    log('<span class="err">no cast.json</span> — run <code>make_preview</code>');
    return;
  }
  for (const c of CAST) {
    const label = (LABELS[c.id] || c.id) + (c.own_face ? "" : "  (stand-in face)");
    $("who").add(new Option(label, c.id));
  }
  pick(CAST[0].id);
})();
</script>
